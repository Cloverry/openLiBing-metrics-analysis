<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流水线失败原因智能定位定界 · 明细</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --line:#e4e7ec; --line2:#eef0f3;
  --txt:#1f2328; --dim:#6b7280; --acc:#2563eb;
  --green:#16a34a; --yellow:#d97706; --red:#dc2626; --gray:#c9ced6;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);
  font:13px/1.55 "Noto Sans CJK SC","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
h1{font-size:21px;margin:0 0 6px;font-weight:600;letter-spacing:.2px;color:#16233a}
h2{font-size:15px;margin:14px 0 10px;padding-left:10px;border-left:3px solid var(--acc);
  color:#1c2b45;font-weight:600}
h3{font-size:13.5px;margin:14px 0 8px;font-weight:600;color:#1c2b45}
.dim{color:var(--dim)}
.mono{font-family:Consolas,"Courier New",monospace}
.num{font-variant-numeric:tabular-nums}

/* ---------- 页面骨架：白卡 + 标题 + 公共日期筛选（两页共用，跳转时顶部不变） ---------- */
.wrap{width:min(1560px,94vw);margin:12px auto;background:var(--panel);border-radius:10px;
  box-shadow:0 1px 6px rgba(16,32,64,.06);padding:18px 30px 20px;
  min-height:calc(100vh - 24px);display:flex;flex-direction:column}
p.meta{font-size:12.5px;color:#7c8698;line-height:1.65;margin:0}
/* 品牌行：两页完全一致，因此它下面的公共筛选条在切页时位置不跳动 */
.hd{margin:0 0 12px}
.hd h1{font-size:21px;margin:0 0 5px}
.hd p.meta{font-size:12.5px}
/* 公共日期筛选条：系统级全局筛选，整条贴到卡片左右边缘并吸顶（top:0），
   首页与二级页共用同一份 DOM + 同一位置（品牌行之下、页面自身标题之上），
   切页、滚动都不动，语义始终是「整个系统的数据筛选」。 */
.toolbar{position:sticky;top:0;z-index:40;display:flex;flex-wrap:wrap;align-items:center;gap:10px;
  margin:0 -30px 14px;padding:8px 30px;background:#fff;
  border-top:1px solid var(--line2);border-bottom:1px solid var(--line);
  box-shadow:0 2px 8px rgba(16,32,64,.05)}
.toolbar .lb{font-size:12.5px;color:#4a5668;font-weight:600;white-space:nowrap}
.toolbar .vsep{width:1px;height:16px;background:#e2e8f0;margin:0 2px}
.toolbar .sp{flex:1 1 auto}
.seg{display:inline-flex;border:1px solid #d9e0ea;border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;border-right:1px solid #e8edf4;background:#fff;padding:6px 14px;font:inherit;
  font-size:13px;color:#4a5668;cursor:pointer;line-height:1.3;transition:.15s}
.seg button:last-child{border-right:0}
.seg button:hover{background:#eef4ff;color:var(--acc)}
.seg button.on{background:var(--acc);color:#fff;font-weight:600}
.dates{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #d9e0ea;
  border-radius:8px;padding:4px 10px}
.dates input[type=date]{border:0;outline:0;font:inherit;font-size:12.5px;color:#2b3547;
  background:transparent;padding:2px 0}
.dates .dash{color:#c2cad6;font-size:12px}
.hint{font-size:12px;color:var(--dim);white-space:nowrap}
.hint b{color:#374151;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;
  border-radius:8px;padding:4px 9px;font:inherit;color:#374151;cursor:pointer}
.chip.on{border-color:#bfd3fe;background:#eff5ff;color:#1d4ed8}
input[type=text],select{border:1px solid var(--line);border-radius:8px;background:#fff;
  padding:5px 9px;font:inherit;color:var(--txt);outline:0}
input[type=text]:focus,select:focus{border-color:#b9cdfb;box-shadow:0 0 0 3px #eaf1ff}
label.sw{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#374151;cursor:pointer}

/* ---------- 卡片 ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.card .k{font-size:12px;color:var(--dim)}
.card .v{font-size:19px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.card .s{font-size:11.5px;color:var(--dim);margin-top:1px}

/* ---------- 表格 ---------- */
/* 表格容器自适应剩余高度：数据条数变化时高度不变，页面不出现外层滚动条 */
.tbl-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  overflow:auto;flex:1 1 auto;height:auto;min-height:320px}
.detail .tbl-wrap{height:auto;max-height:none}
/* 组件级概览表：版式对齐旧报告 table.ov（表头浅蓝底、单元格细右分隔线、行高 7px/14px） */
table.ov{margin:0;border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.ov thead th{position:sticky;top:0;z-index:3;background:#f4f7fb;color:#3b4a60;font-weight:600;
  font-size:12.5px;text-align:center;padding:8px 14px;border:0;border-bottom:1px solid #e6ebf2;
  border-right:1px solid #eef2f7;white-space:nowrap}
table.ov thead th:last-child{border-right:0}
table.ov tbody td{padding:7px 14px;line-height:1.45;border:0;border-bottom:1px solid #eef2f7;
  border-right:1px solid #f5f7fa;background:#fff;vertical-align:middle}
table.ov tbody td:last-child{border-right:0}
table.ov tbody tr:hover td{background:#f6faff}
table.ov .c-name{font-weight:600;color:#1b2739;white-space:nowrap}
table.ov .c-rate{min-width:120px}
table.ov .c-num{text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums;color:#2b3547}
/* 行高由页面脚本按「可用高度 / 行数」算出后写进 --rowh，让数据行刚好铺满表格区：
   条数少时自动拉高、条数多时回落到紧凑行高，且不会撑出外层滚动条。 */
table.ov tbody tr{height:var(--rowh,auto)}
/* 比率单元格：百分比 + 灯点（同旧版 .rate-line） */
.rate-line{display:inline-flex;align-items:center;gap:8px}
.rate-line .pct{min-width:52px;font-weight:600;font-variant-numeric:tabular-nums;color:#1b2739}
.rate-line .dot{margin:0}
/* 可点击数字（同旧版 .lnk）：只在有待分析流水线时出现，点进二级页看明细。
   颜色统一用页面链接色 --acc，和正文里的 a 标签、二级页的「查看记录 →」完全一致 */
.lnk{color:var(--acc);cursor:pointer}
.lnk:hover{text-decoration:underline}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
.nowrap{white-space:nowrap}
.ell{max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gray);
  vertical-align:1px;margin-right:5px}
.dot.green{background:var(--green)} .dot.yellow{background:var(--yellow)} .dot.red{background:var(--red)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:#f3f4f6;
  color:#4b5563;border:1px solid var(--line);margin-right:4px;white-space:nowrap}
.tag.red{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
.tag.yellow{background:#fffbeb;border-color:#fde68a;color:#92400e}
.tag.green{background:#f0fdf4;border-color:#bbf7d0;color:#15803d}
.tag.blue{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}

/* ---------- 二级页 ---------- */
.rec{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px}
.rec-hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 13px;border-bottom:1px solid var(--line2)}
.rec-hd .bn{font-weight:600;font-size:13.5px}
.rec-bd{padding:0 13px 12px}
.rec-sec{margin-top:11px}
.rec-sec .t{font-size:12px;color:var(--dim);margin-bottom:5px}
.rec-sec table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
.rec-sec th{text-align:center;color:#4b5563;font-weight:600;background:#fafbfc;padding:6px 9px;
  border-bottom:1px solid var(--line);white-space:nowrap;position:static}
.rec-sec td{padding:6px 9px;border-bottom:1px solid var(--line2);vertical-align:top}
.empty{color:var(--dim);padding:26px 0;text-align:center}
.ev-list{display:flex;flex-wrap:wrap;gap:6px}
.ev{font-size:11.5px;background:#f8fafc;border:1px solid var(--line);border-radius:6px;
  padding:2px 8px;color:#334155}
.err-line{background:#fbfbfc;border:1px solid var(--line2);border-radius:7px;padding:7px 9px;
  margin-bottom:6px;font-size:12px}
.err-line .src{color:var(--dim);font-size:11px;margin-bottom:2px}
.err-line pre{margin:0;white-space:pre-wrap;word-break:break-all;font-family:Consolas,"Courier New",monospace;
  font-size:11.5px;color:#334155}
.loading{padding:34px 0;text-align:center;color:var(--dim)}
.err{padding:14px;border:1px solid #fecaca;background:#fef2f2;color:#b91c1c;border-radius:var(--radius)}

#back{margin:2px 0 8px;align-self:flex-start}
/* 统计口径只在首页出现（二级页不再重复一份，避免两处口径各写一遍后走岔） */
/* 组件级流水线清单的比率：纯数字百分比（80.0%），不带圆点/灯色 */
table.ov td.c-rate .pct{font-weight:600;font-variant-numeric:tabular-nums;color:#1b2739}
/* 可点的比率（有运行历史、点了弹「构建记录」）必须显成链接色：
   选择器要比上一行更具体才压得住，颜色与正文 a 标签、「查看记录 →」同一个 --acc */
table.ov td.c-rate .pct.lnk{color:var(--acc);cursor:pointer}
table.ov td.c-rate .pct.lnk:hover{text-decoration:underline}
.crumb{margin:2px 0 4px;font-size:13px;color:#666}
.crumb b{color:#222}
/* 面包屑逐层可点：总览 › 组件（维度）› 流水线，点哪一层回哪一层 */
.crumb a{color:var(--acc)}
.crumb .sep{color:#c2cad6;margin:0 5px}
.grow{flex:1 1 auto}

/* ---------- 流水线区块头（同旧报告 h3） ---------- */
.subview h3{font-size:15px;font-weight:600;color:#16233a;line-height:1.6;
  margin:22px 0 8px;padding:8px 12px;background:#f0f5ff;border-radius:6px}
.subview h3:first-of-type{margin-top:8px}
.subview h3 .hist{font-size:12px;font-weight:400;margin-left:8px}
.subview h3 .rate-line{margin-left:8px;font-weight:400;font-size:13px}

/* ---------- 无失败记录时的醒目提醒（不是灰字空态） ----------
   最常见的「有运行、但一条失败记录都没有」其实是「执行成功、测试用例通过率不是 100%」：
   以前这里只写一句灰字「该区间内没有需要根因分析的失败执行记录」，用户必须点开构建记录
   才知道可用度为什么是 0%。现在把结论直接摆在区块头下面，加底色 + 左侧色条。 */
.nofail{margin:10px 0 4px;padding:11px 14px;border-radius:6px;font-size:13px;line-height:1.7;
  background:#fff8e8;border:1px solid #f0ce8e;border-left:4px solid #d98b1f;color:#5c4310}
.nofail .nf-hd{display:block;font-weight:600;font-size:13.5px;color:#9a5b00;margin-bottom:1px}
.nofail b{color:#b8400e}
.nofail .hist{font-size:12px;font-weight:400;margin-left:6px;white-space:nowrap}
/* 没有任何运行 / 归档无运行历史：中性提示，不喊黄 */
.nofail.mute{background:#f7f9fc;border:1px solid #e3e6ea;border-left:4px solid #c8d2e0;color:#5b6779}
.nofail.mute .nf-hd{color:#3b4a60}

/* ---------- 根因明细表（同旧报告 table.rca）：7 列固定列宽，行宽不随内容变化 ---------- */
table.rca{table-layout:fixed;width:100%;border-collapse:collapse;font-size:13px;margin:8px 0 4px}
table.rca th,table.rca td{border:1px solid #e3e6ea;padding:7px 9px;text-align:left;
  vertical-align:top;line-height:1.55;word-break:break-word;overflow-wrap:anywhere}
table.rca th{background:#f7f9fc;font-weight:600;white-space:nowrap;color:#3b4a60;text-align:center}
table.rca tbody tr:nth-child(even) td{background:#fafbfc}
/* 根因明细表每行后面挂了一条「展开行」（rc-det），会把上面的奇偶计数整体打乱，
   所以这张表的斑马纹只按主行自己的奇偶类（rc-alt）上色，展开行另有底色 */
table.rca.rca-rec tbody tr:nth-child(even) td{background:transparent}
table.rca.rca-rec tbody tr.rc-main.rc-alt td{background:#fafbfc}
table.rca.rca-rec tbody tr.rc-main:hover td{background:#f2f7ff}
table.rca td.err-cell{font-size:12.5px}
/* 错误信息列：日志原文必须在列宽内换行（长路径 testcase/cann/... 没有空格，
   只靠 word-break 会撑破列），并按行数截断，超出部分留省略号而不是溢出到下一列 */
table.rca td.err-cell .err-text{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;
  overflow:hidden;white-space:normal;word-break:break-all;overflow-wrap:anywhere}
/* 「证据」链接单独一行、不参与上面的行数截断，保证永远可点 */
table.rca td.err-cell .ev-lnk{display:inline-block;margin-top:3px}
/* 根因 / 建议列：内容按行分点渲染（richPoints 输出 .pt / .pt-lead / .pt-item / .pt-sub / .pt-gap），
   每条问题单独一行，避免一大段文字糊在一起看不出「哪有问题」 */
table.rca td .pt{display:block;line-height:1.6}
table.rca td .pt-hd{display:block;font-weight:600;color:#16233a;line-height:1.6}
table.rca td .pt-gap{display:block;height:5px}
/* 【结论】行：整体加粗，标签用深色块标出来，一眼看到结论在哪 */
table.rca td .pt-lead{display:block;line-height:1.6;font-weight:600;color:#16233a}
table.rca td .pt-lead .pt-tag{color:#1a4b8c;margin-right:2px}
/* 一、二、三 分点：小标题单独一行加粗，编号与正文之间留白 */
table.rca td .pt-item{display:block;line-height:1.6;font-weight:600;color:#16233a;margin-top:3px}
/* 分析过程 / 验证方式：事实行左缩进 + 标签降一级灰度，与上面小标题形成层级 */
table.rca td .pt-sub{display:block;line-height:1.6;padding-left:14px;color:#39485c}
table.rca td .pt-sub .pt-lab{color:#8a94a6}
/* 「第一类（…）：正文」这种散文段：冒号前的短语当小标题加粗，正文直接跟在同一行，
   保证一段话读下来是连贯叙述，而不是被拆成「标题 + 正文」两行 */
table.rca td .pt-sec{display:block;line-height:1.7;color:#39485c}
table.rca td .pt-sec .pt-sec-hd{font-weight:600;color:#16233a;margin-right:2px}
/* 弹窗里的长文本（用例失败详情 / 日志证据原文）：整行完整输出，不截断、不溢出 */
table.rca td.expr-txt{white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;
  font-family:Consolas,Menlo,monospace;font-size:12px;line-height:1.5}
/* 第 1 列「流水线编号」里的构建号链接不折行 */
table.rca td:nth-child(1) a{white-space:nowrap}
/* 第 1 列「流水线编号」：一条记录只有一个构建号，不折行；错误/失败标记另起一行 */
table.rca td.bldg-cell{white-space:normal}
table.rca td.bldg-cell .bldgs a,
table.rca td.bldg-cell .bldgs span.mono{display:inline-block;margin:0 8px 2px 0;white-space:nowrap}
.exec-sub{display:block;color:#999;font-size:11px;margin-top:2px}
.badge{display:inline-block;padding:1px 9px;border-radius:10px;color:#fff;font-size:12px;vertical-align:1px}
.badge.green{background:#52c41a}.badge.yellow{background:#faad14}
.badge.red{background:#f5222d}.badge.gray{background:#999}

/* ---------- 弹窗骨架：三个入口共用（失败用例 / 日志证据 / 构建记录） ----------
   版式固定成「标题 → 表格区（唯一滚动区）→ 脚注」三段：
   外框只做定高、overflow:hidden，所以弹窗自己永不出滚动条；
   纵向滚动条贴着表格右边缘、横向滚动条贴着表格底边，滚动的始终是表格本身。 */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;
  align-items:center;justify-content:center;padding:24px 16px;overflow:hidden}
.modal.on{display:flex}
.modal-box{background:#fff;border-radius:10px;width:min(1280px,96vw);
  max-height:calc(100vh - 48px);overflow:hidden;
  padding:16px 20px;box-shadow:0 8px 30px rgba(16,32,64,.2);
  display:flex;flex-direction:column}
.modal-hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex:0 0 auto;
  font-weight:600;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line2)}
.modal-hd button{background:#fff;border:1px solid #ccc;border-radius:6px;padding:3px 12px;cursor:pointer;font:inherit}
/* 弹窗正文 = 表格区（可滚，吃掉全部剩余高度）+ 脚注（固定不动） */
#mbody{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
/* 表格独占的滚动容器：纵向滚动条在表格右侧、横向滚动条在表格下方，弹窗本身不滚 */
.mtbl{flex:1 1 auto;min-height:0;overflow:auto}
.mtbl table.rca{margin:0}
/* 表头吸顶：表格内滚动时列名始终可见 */
.mtbl table.rca thead th{position:sticky;top:0;z-index:2;background:#f7f9fc;text-align:center;
  box-shadow:inset 0 -1px 0 #e3e6ea,inset 0 1px 0 #e3e6ea}
/* 弹窗表格里的长内容列：一律在列宽内换行（长路径/用例名没有空格也能断），
   绝不横向溢出到相邻列 —— 列宽由 colgroup 固定，行高随内容自然增长 */
table.rca td.cw{white-space:normal;word-break:break-all;overflow-wrap:anywhere}
/* 时间列：优先在「日期」和「时刻」之间的空格处折行，不要从毫秒中间断开 */
table.rca td.cw1{white-space:normal;word-break:normal;overflow-wrap:anywhere}
/* 定性分布：二级页字段，按执行记录计数 */
.dist{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:8px 0 10px;
  padding:8px 12px;background:#fff;border:1px solid var(--line);border-radius:8px;font-size:12px}
.dist:empty{display:none}
.dist .dt{color:#374151;font-weight:600;margin-right:2px}
.dist .sp{flex:1 1 auto}
/* 根因表：开始/结束时间列字号比正文略大一点（13px 表内正文 → 12.5px 等宽，比原先 11px 好读） */
table.rca td.dt-c{font-size:12.5px;color:#16233a;letter-spacing:.2px}

/* ---------- 根因明细表：行内展开（根因 / 建议全文不再占列） ---------- */
/* 行首 ▸：可点，展开后变 ▾；挂在第 1 列构建号前面 */
table.rca td.bldg-cell .exp-ic{display:inline-block;width:13px;margin-right:3px;
  color:var(--acc);cursor:pointer;user-select:none;font-weight:600;font-size:12px;
  transition:transform .12s ease}
table.rca td.bldg-cell .exp-ic:hover{color:#0b63c5}
/* 展开行：colspan 撑满 7 列，浅底 + 左侧色条，与主行的斑马纹区分开 */
table.rca.rca-rec tbody tr.rc-det > td.rc-det-cell{background:#fbfcfe;
  border-left:3px solid #b9cdf0;padding:10px 14px}
table.rca.rca-rec tbody tr.rc-det[hidden]{display:none}

  background:#eef4ff;color:#1a4b8c;font-size:12px;font-weight:600;line-height:17px}
/* 定性列：按根因正文给出的多种可能原因 + 可能性（possFromRootCause，按高到低），第 1 条加粗当主因 */
table.rca td.cat-cell .pp{margin:0 0 4px;line-height:1.5}
